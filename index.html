<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handy</title>
  <link rel="stylesheet" href="css/style.css?v=6">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header>
    <h1>Handy</h1>
    <select id="camera" hidden title="Camera"></select>
    <label class="toggle"><input type="checkbox" id="fireOn" checked> Fire</label>
    <label class="toggle glinda"><input type="checkbox" id="glinda"> Glinda Mode</label>
    <label class="toggle"><input type="checkbox" id="fireAll"> All fingers</label>
    <label class="toggle puppet"><input type="checkbox" id="puppetsOn"> Puppets</label>
    <span id="fps"></span>
  </header>

  <main>
    <section id="stage">
      <video id="video" class="layer" playsinline muted></video>
      <canvas id="overlay" class="layer"></canvas>
      <canvas id="puppets" class="layer"></canvas>
      <canvas id="fire" class="layer"></canvas>
      <canvas id="flowers" class="layer"></canvas>
      <div id="intro">
        <p>Tracks up to eight hands and every finger in 3D from your webcam. Video stays on your computer.</p>
        <button id="start">Start camera</button>
        <p id="status"></p>
      </div>
    </section>

    <aside>
      <div id="view3d" title="Drag to rotate, scroll to zoom"></div>
      <pre id="data">Waiting for camera…</pre>
    </aside>
  </main>

  <script type="module" src="js/main.js?v=6"></script>
</body>
</html>
